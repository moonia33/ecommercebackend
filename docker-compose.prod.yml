# Production stack for Coolify (Docker Compose build pack).
# Postgres and Redis are separate Coolify resources; set DATABASE_URL / REDIS_URL
# and all other variables in Coolify (it passes them to every service via .env).
x-app: &app
  build: .
  restart: unless-stopped
  environment:
    DJANGO_SETTINGS_MODULE: config.settings_prod
  volumes:
    - media:/app/media

services:
  web:
    <<: *app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings_prod
      RUN_MIGRATIONS: "1"
    expose:
      - "8000"

  worker:
    <<: *app
    command: celery -A config worker -l info -Q celery,default
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 10 | grep -q pong"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s

  beat:
    <<: *app
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(b'beat' not in open('/proc/1/cmdline', 'rb').read())"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  media:
